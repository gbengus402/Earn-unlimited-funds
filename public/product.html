<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product | Earn Unlimited Funds</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #071a3d;
      color: white;
      padding: 18px 20px;
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .back {
      color: white;
      text-decoration: none;
      font-size: 15px;
    }

    .container {
      max-width: 900px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .product-box {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .icon {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: #e9f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin-bottom: 20px;
    }

    h1 {
      color: #071a3d;
      font-size: 34px;
      line-height: 1.3;
      margin: 0 0 15px;
    }

    .description {
      color: #596579;
      line-height: 1.8;
      font-size: 17px;
    }

    .price {
      color: #071a3d;
      font-size: 30px;
      font-weight: bold;
      margin: 25px 0;
    }

    .buy-button {
      display: block;
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 8px;
      background: #071a3d;
      color: white;
      text-decoration: none;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy-button:hover {
      background: #123d7a;
    }

    .secure {
      text-align: center;
      color: #6b7485;
      font-size: 14px;
      margin-top: 18px;
    }

    .error {
      text-align: center;
      color: #b42318;
      font-size: 18px;
      padding: 30px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 25px auto;
      }

      .product-box {
        padding: 25px 20px;
      }

      h1 {
        font-size: 27px;
      }

      .description {
        font-size: 16px;
      }

      .price {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">Earn Unlimited Funds</div>
    <a href="/" class="back">← Back to Products</a>
  </div>
</header>

<main class="container">
  <div class="product-box" id="productBox">
    Loading product...
  </div>
</main>

<script>

const products = {

  "how-to-pass-high-in-exams": {
    name: "How to Pass High in Exams",
    price: "₦25,000",
    icon: "📚",
    description:
      "Learn practical study strategies, examination preparation techniques, time-management methods and useful approaches that can help you prepare more effectively for your exams."
  },

  "ai-response-complete-guide": {
    name: "AI Response Complete Guide",
    price: "₦40,000",
    icon: "🤖",
    description:
      "Learn practical ways to use AI for better responses, generating ideas, improving productivity, communication, learning and online work."
  },

  "facebook-automation": {
    name: "Facebook Automation",
    price: "₦60,000",
    icon: "📱",
    description:
      "Learn practical Facebook automation strategies for managing your online presence, responding to customers and improving your digital marketing workflow."
  },

  "save-a-billion-from-zero-account": {
    name: "How to Save a Billion from a Zero Account",
    price: "₦80,000",
    icon: "💰",
    description:
      "Explore practical saving habits, financial planning principles, money-management strategies and long-term approaches to developing stronger financial discipline."
  },

  "pregnancy-care": {
    name: "Pregnancy Care Guide",
    price: "₦150,000",
    icon: "🤰",
    description:
      "A practical pregnancy-care guide covering general preparation, healthy routines, important considerations and useful information for navigating pregnancy. This guide does not replace professional medical advice."
  },

  "sell-faster": {
    name: "Sell Faster Professional Ebook",
    price: "₦150,200",
    icon: "🚀",
    description:
      "Learn practical selling approaches, customer attraction methods, offer presentation techniques and strategies that can help you improve your sales process."
  }

};


const params = new URLSearchParams(window.location.search);

const productId = params.get("id");

const product = products[productId];

const productBox = document.getElementById("productBox");


if (!product) {

  productBox.innerHTML = `
    <div class="error">
      <h2>Product Not Found</h2>
      <p>Please return to the products page and select a product.</p>
      <a href="/" class="buy-button">
        Back to Products
      </a>
    </div>
  `;

} else {

  productBox.innerHTML = `

    <div class="icon">
      ${product.icon}
    </div>

    <h1>
      ${product.name}
    </h1>

    <p class="description">
      ${product.description}
    </p>

    <div class="price">
      ${product.price}
    </div>

    <a
      href="#"
      class="buy-button"
      id="buyButton"
    >
      BUY NOW
    </a>

    <div class="secure">
      🔒 Secure digital purchase
    </div>

  `;

  document.getElementById("buyButton").addEventListener("click", function(event) {

    event.preventDefault();

    alert(
      "Payment setup is not connected yet. The product has been added to your store successfully."
    );

  });

}

</script>

</body>
</html>
