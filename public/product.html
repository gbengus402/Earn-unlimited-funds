<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Product | Earn Unlimited Funds</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #071a3d;
      color: white;
      padding: 18px 20px;
    }

    header .inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: 45px auto;
    }

    .product-card {
      background: white;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .product-title {
      color: #071a3d;
      font-size: 34px;
      margin-top: 0;
      margin-bottom: 15px;
    }

    .description {
      color: #4b5563;
      font-size: 17px;
      line-height: 1.7;
    }

    .price {
      font-size: 30px;
      font-weight: bold;
      color: #071a3d;
      margin: 25px 0;
    }

    .buy-box {
      margin-top: 30px;
      padding: 25px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #071a3d;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0d2b63;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 9px;
      line-height: 1.5;
    }

    .error {
      background: #fef2f2;
      color: #991b1b;
    }

    .info {
      background: #eff6ff;
      color: #1e40af;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      color: #071a3d;
      font-weight: bold;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .product-card {
        padding: 23px;
      }

      .product-title {
        font-size: 27px;
      }

      .price {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="inner">
    <h1>Earn Unlimited Funds</h1>

    <a href="/">
      Home
    </a>
  </div>
</header>

<div class="container">

  <div class="product-card">

    <h2
      class="product-title"
      id="productName"
    >
      Loading product...
    </h2>

    <p
      class="description"
      id="productDescription"
    >
      Please wait...
    </p>

    <div
      class="price"
      id="productPrice"
    >
      ₦0
    </div>

    <div class="buy-box">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email address"
        required
      >

      <button
        id="buyButton"
        type="button"
      >
        Buy Now
      </button>

      <div
        id="infoMessage"
        class="message info"
      ></div>

      <div
        id="errorMessage"
        class="message error"
      ></div>

    </div>

    <a
      class="back"
      href="/"
    >
      ← Back to all products
    </a>

  </div>

</div>

<script>

  // =====================================================
  // GET PRODUCT ID
  // =====================================================

  const params =
    new URLSearchParams(
      window.location.search
    );

  const productId =
    params.get("id");

  // =====================================================
  // PAGE ELEMENTS
  // =====================================================

  const productName =
    document.getElementById("productName");

  const productDescription =
    document.getElementById("productDescription");

  const productPrice =
    document.getElementById("productPrice");

  const buyButton =
    document.getElementById("buyButton");

  const emailInput =
    document.getElementById("email");

  const infoMessage =
    document.getElementById("infoMessage");

  const errorMessage =
    document.getElementById("errorMessage");

  // =====================================================
  // LOAD PRODUCT
  // =====================================================

  async function loadProduct() {

    if (!productId) {

      productName.textContent =
        "Product not found";

      productDescription.textContent =
        "No product was selected.";

      buyButton.disabled = true;

      return;
    }

    try {

      const response =
        await fetch(
          "/api/products/" +
          encodeURIComponent(productId)
        );

      const data =
        await response.json();

      if (
        !response.ok ||
        !data.success
      ) {
        throw new Error(
          data.message ||
          "Product not found."
        );
      }

      const product =
        data.product;

      productName.textContent =
        product.name;

      productDescription.textContent =
        product.description;

      productPrice.textContent =
        "₦" +
        Number(
          product.priceNaira
        ).toLocaleString();

    } catch (error) {

      productName.textContent =
        "Unable to load product";

      productDescription.textContent =
        error.message;

      buyButton.disabled = true;
    }
  }

  // =====================================================
  // BUY NOW
  // =====================================================

  buyButton.addEventListener(
    "click",
    function () {

      errorMessage.style.display =
        "none";

      infoMessage.style.display =
        "none";

      const email =
        emailInput.value.trim();

      if (!email) {

        errorMessage.textContent =
          "Please enter your email address.";

        errorMessage.style.display =
          "block";

        return;
      }

      if (
        !email.includes("@") ||
        !email.includes(".")
      ) {

        errorMessage.textContent =
          "Please enter a valid email address.";

        errorMessage.style.display =
          "block";

        return;
      }

      // =================================================
      // HOW TO PASS HIGH IN EXAMS
      // =================================================

      if (
        productId ===
        "how-to-pass-high-in-exams"
      ) {

        infoMessage.textContent =
          "Opening secure Selar checkout...";

        infoMessage.style.display =
          "block";

        buyButton.disabled = true;

        buyButton.textContent =
          "Opening Selar...";

        window.location.href =
          "https://selar.com/5m7y791u94";

        return;
      }

      // =================================================
      // OTHER PRODUCTS
      // =================================================

      errorMessage.textContent =
        "Selar checkout has not yet been connected for this product.";

      errorMessage.style.display =
        "block";
    }
  );

  // =====================================================
  // START
  // =====================================================

  loadProduct();

</script>

</body>
</html>
