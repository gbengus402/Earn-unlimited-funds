<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product | Earn Unlimited Funds</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: #0757c8;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: 35px auto;
      padding: 20px;
    }

    .product-card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .product-card h2 {
      margin-top: 0;
      color: #0757c8;
      font-size: 28px;
    }

    .description {
      color: #555;
      line-height: 1.7;
      font-size: 16px;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      color: #111;
      margin: 22px 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #0757c8;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #06449d;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      line-height: 1.5;
    }

    .error {
      display: block;
      background: #ffe5e5;
      color: #b00020;
    }

    .loading {
      display: block;
      background: #e8f1ff;
      color: #0757c8;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #0757c8;
      text-decoration: none;
      font-weight: bold;
    }

    .security {
      margin-top: 20px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>Earn Unlimited Funds</h1>
  <p>Digital Products & Learning Resources</p>
</header>

<div class="container">

  <div class="product-card">

    <h2 id="productName">Loading product...</h2>

    <p class="description" id="productDescription">
      Please wait...
    </p>

    <div class="price" id="productPrice">
      ...
    </div>

    <form id="paymentForm">

      <label for="email">
        Enter your email address
      </label>

      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        required
      >

      <button
        type="submit"
        id="buyButton"
      >
        Buy Now
      </button>

    </form>

    <div
      id="message"
      class="message"
    ></div>

    <div class="security">
      🔒 Secure checkout through Selar
    </div>

    <a
      href="products.html"
      class="back"
    >
      ← Back to Products
    </a>

  </div>

</div>

<script>

  const productName =
    document.getElementById("productName");

  const productDescription =
    document.getElementById("productDescription");

  const productPrice =
    document.getElementById("productPrice");

  const paymentForm =
    document.getElementById("paymentForm");

  const emailInput =
    document.getElementById("email");

  const buyButton =
    document.getElementById("buyButton");

  const message =
    document.getElementById("message");


  /*
    Get product ID from URL.

    Example:

    product.html?id=facebook-automation
  */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const productId =
    params.get("id");


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  function formatPrice(amount) {

    return "₦" +
      Number(amount).toLocaleString(
        "en-NG"
      );

  }


  async function loadProduct() {

    if (!productId) {

      productName.textContent =
        "Product Not Found";

      productDescription.textContent =
        "No product was selected.";

      productPrice.textContent =
        "";

      buyButton.disabled = true;

      return;

    }


    try {

      const response =
        await fetch(
          "/api/products/" +
          encodeURIComponent(productId)
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.success ||
        !data.product
      ) {

        throw new Error(
          data.message ||
          "Product not found."
        );

      }


      const product =
        data.product;


      productName.textContent =
        product.name;


      productDescription.textContent =
        product.description;


      productPrice.textContent =
        formatPrice(
          product.priceNaira
        );


      document.title =
        product.name +
        " | Earn Unlimited Funds";


    } catch (error) {

      console.error(error);


      productName.textContent =
        "Unable to load product";


      productDescription.textContent =
        error.message;


      buyButton.disabled = true;

    }

  }


  paymentForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const email =
        emailInput.value
          .trim()
          .toLowerCase();


      if (!productId) {

        showMessage(
          "Product ID is missing.",
          "error"
        );

        return;

      }


      if (!email) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        return;

      }


      buyButton.disabled = true;

      buyButton.textContent =
        "Preparing Checkout...";


      showMessage(
        "Please wait...",
        "loading"
      );


      try {

        const response =
          await fetch(
            "/api/pay",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                email: email,
                product_id: productId
              })
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.message ||
            "Unable to start payment."
          );

        }


        /*
          Save the reference locally
          in case the browser needs it
          after returning from Selar.
        */

        localStorage.setItem(
          "euf_reference",
          data.reference
        );


        localStorage.setItem(
          "euf_product",
          data.product_id
        );


        localStorage.setItem(
          "euf_email",
          email
        );


        /*
          Send customer to Selar.
        */

        window.location.href =
          data.checkout_url;


      } catch (error) {

        console.error(error);


        showMessage(
          error.message ||
          "Unable to start payment.",
          "error"
        );


        buyButton.disabled = false;

        buyButton.textContent =
          "Buy Now";

      }

    }
  );


  loadProduct();

</script>

</body>
</html>
