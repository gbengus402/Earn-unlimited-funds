
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Payment Successful | Earn Unlimited Funds</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: white;
      max-width: 600px;
      width: 100%;
      text-align: center;
      padding: 45px 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .icon {
      font-size: 65px;
      margin-bottom: 20px;
    }

    h1 {
      color: #071a3d;
      margin-bottom: 15px;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .button {
      display: inline-block;
      background: #071a3d;
      color: white;
      padding: 14px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">✅</div>

    <h1>Payment Successful!</h1>

    <p>
      Thank you for purchasing
      <strong>How to Pass High in Exams</strong>.
    </p>

    <p>
      Your payment has been verified successfully.
    </p>

    <p id="status">
      Preparing your secure download...
    </p>

    <a
      id="downloadButton"
      href="/api/download"
      class="button"
    >
      Download Your Product
    </a>

    <br>

    <a href="/" class="button">
      Return to Store
    </a>

  </div>

  <script>
    /*
      The payment callback has already verified the
      Paystack transaction and placed the secure
      download cookie in the browser.

      When the customer reaches this page,
      send them directly to the protected download.
    */

    setTimeout(function () {
      window.location.href = "/api/download";
    }, 1500);
  </script>

</body>
</html>
