<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Payment Successful | Earn Unlimited Funds</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f7fb;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 35px 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
    }

    .icon {
      font-size: 65px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 10px 0;
      color: #111827;
    }

    p {
      color: #555;
      line-height: 1.6;
    }

    #productName {
      color: #0b63ce;
      font-weight: bold;
    }

    #status {
      margin-top: 25px;
      font-weight: bold;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 24px;
      background: #0b63ce;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .button:hover {
      opacity: 0.9;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #c62828;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">✅</div>

    <h1>Payment Successful!</h1>

    <p>
      Thank you for your purchase.
    </p>

    <p>
      Product:
      <span id="productName">Checking...</span>
    </p>

    <p id="status">
      Verifying your payment and preparing your secure download...
    </p>

    <div id="downloadArea" class="hidden">

      <a
        id="downloadButton"
        class="button"
        href="#"
      >
        Download Your Product
      </a>

    </div>

    <br>

    <a
      href="/"
      class="button"
    >
      Return to Store
    </a>

  </div>

  <script>

    const params =
      new URLSearchParams(window.location.search);

    const reference =
      params.get("reference");

    const productId =
      params.get("product");

    const productName =
      document.getElementById("productName");

    const status =
      document.getElementById("status");

    const downloadArea =
      document.getElementById("downloadArea");

    const downloadButton =
      document.getElementById("downloadButton");


    async function checkPayment() {

      if (!reference) {

        status.textContent =
          "Payment reference is missing.";

        status.classList.add("error");

        return;
      }

      try {

        const response =
          await fetch(
            `/api/get-download?reference=${encodeURIComponent(reference)}`
          );

        const data =
          await response.json();

        if (data.paid && data.download_url) {

          productName.textContent =
            data.product_name || productId || "Your product";

          status.textContent =
            "Your payment has been verified. Your secure download is ready.";

          downloadButton.href =
            data.download_url;

          downloadArea.classList.remove("hidden");

          return;
        }

        status.textContent =
          "Payment is being verified. Please wait...";

      } catch (error) {

        console.error(error);

        status.textContent =
          "We are checking your payment. Please wait...";
      }

      setTimeout(
        checkPayment,
        2000
      );
    }

    checkPayment();

  </script>

</body>
</html>
