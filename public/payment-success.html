<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Payment Successful | Earn Unlimited Funds</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: white;
      max-width: 600px;
      width: 100%;
      text-align: center;
      padding: 45px 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .icon {
      font-size: 65px;
      margin-bottom: 20px;
    }

    h1 {
      color: #071a3d;
      margin-bottom: 15px;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .button {
      display: inline-block;
      background: #071a3d;
      color: white;
      padding: 14px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
    }

    .button:hover {
      opacity: 0.9;
    }

    #downloadButton {
      display: none;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }

    .error {
      color: #b00020;
    }

    .success {
      color: #087f23;
    }
  </style></head><body>  <div class="card"><div class="icon">✅</div>

<h1>Payment Successful!</h1>

<p id="productMessage">
  Your payment is being verified.
</p>

<p id="status">
  Preparing your secure download...
</p>

<a
  id="downloadButton"
  href="#"
  class="button"
>
  Download Your Product
</a>

<br>

<a href="/" class="button">
  Return to Store
</a>

  </div>  <script>
    const params = new URLSearchParams(window.location.search);

    const reference = params.get("reference");
    const productId = params.get("product");

    const status = document.getElementById("status");
    const downloadButton =
      document.getElementById("downloadButton");

    const productMessage =
      document.getElementById("productMessage");

    let attempts = 0;
    const maxAttempts = 15;

    async function checkPayment() {
      attempts++;

      if (!reference) {
        status.textContent =
          "Payment reference was not found.";

        status.className = "error";
        return;
      }

      try {
        const response = await fetch(
          `/api/get-download?reference=${encodeURIComponent(reference)}`
        );

        const data = await response.json();

        if (data.success && data.paid && data.download_url) {

          productMessage.innerHTML =
            `Your purchase of <strong>${data.product_name}</strong> has been verified.`;

          status.textContent =
            "Your secure download is ready.";

          status.className = "success";

          downloadButton.href =
            data.download_url;

          downloadButton.style.display =
            "inline-block";

          return;
        }

        if (attempts < maxAttempts) {

          status.textContent =
            "Waiting for payment verification...";

          setTimeout(checkPayment, 2000);

        } else {

          status.textContent =
            "Payment verification is taking longer than expected. Please refresh this page in a moment.";

          status.className = "error";
        }

      } catch (error) {

        console.error(error);

        if (attempts < maxAttempts) {

          status.textContent =
            "Connecting to payment verification...";

          setTimeout(checkPayment, 2000);

        } else {

          status.textContent =
            "Unable to verify payment right now. Please refresh the page.";

          status.className = "error";
        }
      }
    }

    checkPayment();
  </script></body>
</html>
