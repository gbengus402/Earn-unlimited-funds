<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Test Payment Success | Earn Unlimited Funds</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #071a3d;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      width: 92%;
      max-width: 650px;
      margin: 50px auto;
    }

    .card {
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .success {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h2 {
      color: #071a3d;
      margin-bottom: 12px;
    }

    p {
      color: #4b5563;
      line-height: 1.7;
    }

    .product {
      margin: 25px 0;
      padding: 20px;
      background: #f8fafc;
      border-radius: 12px;
      text-align: left;
    }

    .product strong {
      display: block;
      color: #071a3d;
      margin-bottom: 8px;
    }

    .download {
      display: block;
      width: 100%;
      padding: 16px;
      background: #071a3d;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      margin-top: 20px;
    }

    .download:hover {
      background: #0d2b63;
    }

    .test {
      margin-top: 25px;
      padding: 12px;
      background: #fff7ed;
      color: #9a3412;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>Earn Unlimited Funds</h1>
</header>

<div class="container">

  <div class="card">

    <div class="success">✓</div>

    <h2>Payment Successful</h2>

    <p>
      Thank you for your purchase.
      Your product is ready.
    </p>

    <div class="product">

      <strong>
        How to Pass High in Exams
      </strong>

      <span>
        Your digital product is ready for download.
      </span>

    </div>

    <a
      class="download"
      href="/downloads/how-to-pass-high-in-exams.pdf"
    >
      Download Your Product
    </a>

    <div class="test">
      TEST MODE — No payment was made.
    </div>

  </div>

</div>

</body>
</html>
